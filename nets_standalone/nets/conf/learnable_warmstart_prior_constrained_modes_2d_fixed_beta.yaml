run_name: nets_learnable_warmstart_prior_constrained_modes_2d_fixed_beta
run_group: nets_warmstart_prior
wandb: false
wandb_project: null

x_dim: 16
density_path: learnable_warmstart_potential_sum_fixed_beta
learnable_hiddens: [512, 512, 512, 512, 512, 512]
target: constrained_random_gmm
target_mode_weights: [0.3, 0.7]
target_mode_covariances: [1, 6]
target_min_mode_distance: 10.0
target_seed: 41
cov_scale: 1.0
source_std: 1.0


prior_beta_max: 1.0
prior_beta_decay_rate: 15.0
# Optional; if omitted and the target is a GMM, target means are used as warm starts.
# prior_warmstart_means:
#   - [-10.0, -10.0]
#   - [0.0, 10.0]
#   - [10.0, -5.0]
# Optional; if omitted the warm-start prior uses uniform component weights.
# prior_mode_weights: [0.34, 0.33, 0.33]

device: auto
seed: 41
max_epochs: 50
lr: 0.001
lr_burn_in_epochs: 10
step_size: 10
gamma: 0.97
checkpoint_burn_in_epochs: 10
save_top_k: 1
component_bal_lambda: 0.0
plot_every_n_epochs: 5
plot_num_trajectories: 24
plot_min_points: 2000
num_seeds: 1
multiseed_seeds: null
multiseed_vary_target_seed: false
eval_plot_every_seed: 1
eval_plot_num_trajectories: 128
eval_plot_min_points: 4000
cross_section_dim_pairs: null
cross_section_max_pairs: 6
marginal_dims: null
marginal_max_dims: 8

use_persistent_sample_buffer: true
persistent_sample_buffer_trajectories: 2000
train_trajectories: 250
train_steps_per_epoch: 100
val_trajectories: 1000
val_steps_per_epoch: 2
val_freq: 5

annealing_scheduler: linear
start_T: 0.1
dT: 0.1
epochs_per_T: 5
avg_dt: 0.02
record_every: 20
divergence_mode: autograd

control_hiddens: [512, 512, 512, 512, 512, 512]
free_energy_hiddens: [512, 512, 512, 512, 512, 512]

use_fourier: false
x_fourier_dim: 8
x_fourier_sigma: 0.1
t_fourier_dim: 8
t_fourier_sigma: 1.0

proposal : overdamped_langevin
damping: 10.0
use_jarzynski: true

verbose: false
memory_profile: false

hydra:
  run:
    dir: .
  output_subdir: null
